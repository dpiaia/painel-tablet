<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">

<!-- iPad: "Adicionar à Tela de Início" abre sem a barra do Safari, em tela
     cheia, e o Acesso Guiado tranca ali. É o equivalente do Fully Kiosk no
     iOS, sem instalar nada. No Android estas linhas não fazem mal nenhum. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIAIA OS">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<title>Painel</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="temas.css">
</head>
<body>

<header class="topo" id="topo-barra">
  <div class="marca toque" data-menu="temas"><b id="marca-nome">PIAIA</b><span id="marca-fim">OS</span></div>
  <div class="selo" id="selo"><i></i>ONLINE</div>
  <div class="empurra"></div>
  <div class="sist" id="sist"></div>
  <!-- Os créditos saíram do nome e vieram para cá. O nome agora abre ajustes,
       e ajuste e crédito não são a mesma gaveta: o "i" é onde todo sistema põe
       "sobre", e fica onde o olho já vai procurar — no fim da barra, depois da
       bateria. -->
  <button class="info toque" id="info" data-tela="sobre" aria-label="Sobre o painel">i</button>
  <!-- Selo do tema, na ponta direita. Depois do wifi/bateria de propósito: os
       dados mudam o tempo todo e o selo não, então ele ancora o canto. -->
  <img class="selo-tema" id="selo-tema" alt="" hidden>
  <!-- Só aparece no modo relógio. Fica na barra, depois da bateria: é o
       lugar onde o olho já procura controle, e flutuando no canto ele
       competia com a hora pelo centro da tela. -->
  <button class="voltar-hora" id="voltar-hora">voltar</button>
</header>

<!-- As colunas nascem VAZIAS. Quem as preenche é montarLayout(), lendo a
     configuração: assim dá para mover qualquer widget para qualquer posição de
     qualquer coluna sem tocar neste arquivo. Antes o layout era este HTML, e
     arrastar não teria onde gravar. -->
<main class="painel">
  <div class="coluna" id="col-esq"></div>
  <div class="coluna" id="col-dir"></div>
</main>

<!-- Estoque: todo widget que é um nó pronto mora aqui e é MOVIDO para a
     coluna. Nó movido preserva estado (o gif no meio da animação, a rolagem),
     coisa que recriar o HTML perderia a cada mudança de layout. -->
<div id="estoque" hidden>

<section data-widget="relogio" class="relogio">
      <div class="hora"><span id="h-h">--</span><i class="dp">:</i><span id="h-m">--</span></div>
      <div class="data"><span id="data">&nbsp;</span><span id="marcas"></span></div>
    </section>

<section data-widget="clima" class="cartao toque" data-cartao="clima" data-tela="clima">
      <header>
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M6 17h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.2-1.6A3.6 3.6 0 0 0 6 17z"/><path d="M9 20l-1 2M13 20l-1 2M17 20l-1 2"/></svg><span id="clima-cidade">—</span></h2>
      </header>
      <div class="clima-corpo">
        <div class="clima-esq" id="clima-esq"><div class="vazio">carregando…</div></div>
        <div class="clima-dir" id="clima-dir"></div>
      </div>
    </section>

<section data-widget="recado" class="cartao recado" data-cartao="recado" hidden>
      <header>
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span id="recado-titulo">RECADO</span></h2>
      </header>
      <div class="corpo recado-corpo"><p id="recado-texto"></p></div>
    </section>

<section data-widget="agenda" class="cartao agenda toque" data-cartao="agenda" data-tela="agenda">
      <header>
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg>AGENDA</h2>
        <span class="canto" id="agenda-canto"></span>
      </header>
      <div class="destaque" id="destaque"></div>
      <div class="lista" id="lista"></div>
    </section>

<section data-widget="mensagens" class="cartao mensagens" data-cartao="mensagens">
        <header>
          <h2><svg class="ic" viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>MENSAGENS</h2>
          <span class="canto" id="msg-aviso"></span>
        </header>
        <div class="palco" id="palco"></div>
        <div class="pontos" id="pontos"></div>
      </section>

<!-- O monitor do Mac virou widget de SLIDE (ver slideMonitor no app.js):
     ele é desenhado no molde, como os do Claude e do GitHub. -->

</div>

<!-- Molde do cartão que hospeda widgets de slide: Claude, PRs meus, PRs do
     design. Sozinho vira um cartão comum; agrupado, um slider. É o mesmo
     molde nos dois casos — um grupo de um só. -->
<template id="molde-host">
  <section class="cartao toque">
    <header>
      <h2></h2>
      <span class="etq laranja"></span>
    </header>
    <div class="palco"></div>
    <div class="pontos"></div>
  </section>
</template>

<!-- Tela de detalhe: ocupa tudo, só leitura, volta ao toque. Fica fora do
     <main> porque quando ela abre o painel some por completo (display:none),
     senão os GIFs continuariam decodificando atrás dela. -->
<!-- Festa de conclusão: some a tela inteira por alguns segundos quando uma
     tarefa do Claude termina. Fica fora do .painel de propósito — é uma
     camada por cima de tudo, inclusive da tela de detalhe. -->
<!-- Varredura do tubo, só no tema Matrix. Fica fora do .painel porque cobre a
     tela toda, e abaixo das cenas: elas têm cor própria e ficariam esverdeadas
     por cima. Quem liga e desliga é o CSS pelo data-tema, não o JS. -->
<!-- Modo relógio: os cartões somem e a hora ocupa a tela. É um relógio NOVO,
     não o do painel movido para cá — mover o nó obrigaria o motor de layout a
     saber deste modo, e um segundo dono do mesmo elemento é onde essas coisas
     quebram. São dois campos de texto; duplicar custa menos que acoplar. -->
<div class="modo-hora" id="modo-hora" hidden>
  <!-- Três pedaços porque os dois-pontos precisam de vida própria: um tema
       pinta eles de outra cor e faz piscar. Como o <i> nunca é reescrito, a
       animação dele não reinicia a cada minuto. -->
  <div class="hora-grande"><span id="hg-h">--</span><i class="dp">:</i><span id="hg-m">--</span></div>
  <div class="data-grande" id="data-grande"></div>
</div>

<div class="crt" aria-hidden="true"><i></i></div>

<div class="festa" id="festa" hidden>

  <!-- Confete: quadradinhos caindo, para combinar com o pixel art. São
       criados uma vez pelo app.js e só animam translate3d — o compositor dá
       conta, o que não seria verdade se cada um repintasse área. -->
  <div class="festa-confete" id="festa-confete"></div>

  <!-- Um SVG só, com o corpo desenhado uma vez e os olhos trocando por cima.
       Quatro arquivos separados fariam o bichinho piscar e saltar entre os
       quadros, porque cada troca é uma imagem nova para carregar e medir. -->
  <!-- viewBox cortado no desenho (o topo do ícone original é 37% de vazio):
       sem isso o bichinho desce na tela e o nome encosta nas pernas. -->
  <svg class="festa-clawd" viewBox="0 17 48 31">
    <g class="corpo">
      <rect x="6" y="18" width="36" height="24"/>
      <rect x="9" y="39" width="3" height="9"/>
      <rect x="15" y="39" width="3" height="9"/>
      <rect x="30" y="39" width="3" height="9"/>
      <rect x="36" y="39" width="3" height="9"/>
      <rect x="0" y="33" width="7.5" height="6"/>
      <rect x="40.25" y="33" width="7.5" height="6"/>
    </g>
    <g class="olhos" data-fase="frente">
      <rect x="16.5" y="24" width="3" height="6"/>
      <rect x="28.5" y="24" width="3" height="6"/>
    </g>
    <g class="olhos" data-fase="esquerda">
      <rect x="9"  y="24" width="3" height="6"/>
      <rect x="21" y="24" width="3" height="6"/>
    </g>
    <g class="olhos" data-fase="direita">
      <rect x="24" y="24" width="3" height="6"/>
      <rect x="36" y="24" width="3" height="6"/>
    </g>
    <g class="olhos" data-fase="pisca">
      <rect x="16.5" y="24"   width="3"   height="6"/>
      <rect x="28.5" y="25.5" width="7.5" height="3"/>
    </g>
    <g class="olhos" data-fase="oculos">
      <rect x="12" y="24" width="9" height="9"/>
      <rect x="27" y="24" width="9" height="9"/>
      <rect x="21" y="24" width="6" height="3"/>
      <rect x="6"  y="24" width="7" height="3"/>
      <rect x="35" y="24" width="7" height="3"/>
    </g>
  </svg>

  <!-- A marca do GitHub, para as cenas de pull request. Vai em branco liso,
       sem disco: o fundo já é a cor do status, e um disco de outra cor por
       cima brigaria com ela. Branco funciona sobre azul, verde e vermelho. -->
  <svg class="festa-git" id="festa-git" viewBox="0 0 24 24" hidden>
    <path fill="#ffffff" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.3v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/>
  </svg>

  <!-- O relógio da cena de compromisso. Os ponteiros marcam a HORA DA
       REUNIÃO, não a de agora: quem olha de longe já sabe quando é sem ler
       número nenhum. -->
  <svg class="festa-relogio" id="festa-relogio" viewBox="0 0 48 48" hidden>
    <circle cx="24" cy="24" r="21" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <line id="ponteiro-h" x1="24" y1="24" x2="24" y2="14"
          stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <line id="ponteiro-m" x1="24" y1="24" x2="24" y2="8.5"
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="1.9" fill="#ffffff"/>
  </svg>

  <!-- Octocat do Octodex nas cenas do GitHub. Entra no lugar da marca quando
       as imagens foram baixadas; sem elas, a marca continua valendo. -->
  <img class="festa-foto" id="festa-foto" alt="" hidden>

  <div class="festa-texto" id="festa-texto">
    <div class="festa-nome" id="festa-nome"></div>
    <div class="festa-rot" id="festa-rot">FINALIZADO</div>
  </div>

</div>

<!-- Menu de configurações, aberto pelo nome. Um só marcador para oito formas:
     cartão no Escuro/Claro/Apple/Orkut, cartão de topo azul no Facebook, menu
     Iniciar no 95 e no XP, terminal no Matrix. Quem decide é o data-tema — o
     JS escreve sempre a mesma lista. -->
<div class="menu" id="menu" hidden>
  <div class="menu-caixa">
    <div class="menu-topo"><span class="menu-titulo">Temas</span></div>
    <div class="menu-lista" id="menu-lista"></div>
  </div>
</div>

<div class="tela" id="tela" hidden>
  <header>
    <h2 id="tela-titulo"></h2>
    <span class="voltar">toque para voltar</span>
  </header>
  <div class="tela-corpo" id="tela-corpo"></div>
</div>

<script src="app.js"></script>
</body>
</html>
